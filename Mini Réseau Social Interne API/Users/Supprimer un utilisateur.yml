info:
  name: Supprimer un utilisateur
  type: http
  seq: 5
  tags:
    - Users

http:
  method: DELETE
  url: "{{baseUrl}}/api/users{{userId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: Utilisateur supprimé
    request:
      url: "{{baseUrl}}/api/users/:id"
      method: DELETE
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Utilisateur introuvable
    request:
      url: "{{baseUrl}}/api/users/:id"
      method: DELETE
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
